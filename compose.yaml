name: echosense-local

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ECHOSENSE_POSTGRES_PORT:-55432}:5432"
    environment:
      POSTGRES_DB: ${ECHOSENSE_POSTGRES_DB:-echosense_dev}
      POSTGRES_USER: ${ECHOSENSE_POSTGRES_USER:-echosense_dev}
      POSTGRES_PASSWORD: ${ECHOSENSE_POSTGRES_PASSWORD:?Generate .env.local first}
      ECHOSENSE_POSTGRES_TEST_DB: ${ECHOSENSE_POSTGRES_TEST_DB:-echosense_test}
    volumes:
      - echosense_postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/01-create-test-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  echosense_postgres_data:
