[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"app/routers/system_logs.py" = ["E741"]
"app/schemas/alert.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
