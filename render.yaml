services:
  - type: web
    name: echosense-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python scripts/render_migrate.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ALEMBIC_DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ECHOSENSE_CONTROLLED_TEST_MODE
        sync: false
      - key: ECHOSENSE_CONTROLLED_TEST_USER_ID
        sync: false
      - key: EXPO_ACCESS_TOKEN
        sync: false
      - key: RUN_LEGACY_STARTUP_MAINTENANCE
        value: "false"
